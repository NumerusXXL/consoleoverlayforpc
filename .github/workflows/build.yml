name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ConsoleOverlay.sln -c Release
      - name: Publish
        run: dotnet publish src/ConsoleOverlay/ConsoleOverlay.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleOverlay-win-x64
          path: publish
